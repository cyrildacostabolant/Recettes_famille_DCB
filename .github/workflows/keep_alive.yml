name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 5 * * *' # Tous les jours à 5h00 UTC
  workflow_dispatch: # Pour tester manuellement

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Recipes Table
        run: |
          curl --fail -i -X GET "https://zqxqeqdenndhtvktmabs.supabase.co/rest/v1/recipes?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

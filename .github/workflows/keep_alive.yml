name: Supabase Keep Alive

on:
  schedule:
    # S'exécute tous les jours à 05:00 du matin (heure UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet de lancer le test manuellement quand tu veux

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Recipes Table
        run: |
          curl -X GET "https://zqxgeqdenndhtvktmabs.supabase.co/rest/v1/recipes?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
